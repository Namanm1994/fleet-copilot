name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (pinned)
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Lint
        run: ruff check fleet_copilot evals tests
      - name: Unit tests (no LLM, no network)
        run: pytest
      - name: Evals (recorded mode, offline)
        # Replays the committed recordings of the final run on the committed sample dataset.
        # The command exits with an error while any category misses its pass bar. That result is
        # reported (see the uploaded eval report) but does not fail the build: lint and unit
        # tests decide pass or fail.
        continue-on-error: true
        run: fleet eval --mode recorded --runs 3
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: var/eval/eval_report.md
