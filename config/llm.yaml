# LLM settings. Environment variables FLEET_LLM_PROVIDER and FLEET_LLM_MODEL override these.
provider: openrouter
models:
  anthropic: claude-sonnet-5-5
  openai: ""          # set the pinned model ID you want to use
  openrouter: "nvidia/nemotron-3-ultra-550b-a55b:free"   # the model every recorded eval result was run on
base_urls:
  openrouter: https://openrouter.ai/api/v1
api_key_env:
  anthropic: ANTHROPIC_API_KEY
  openai: OPENAI_API_KEY
  openrouter: OPENROUTER_API_KEY
temperature: 0
# Per call, and it includes hidden reasoning tokens. An answer listing 12 findings did not fit in 1,500.
max_output_tokens: 4000
call_timeout_s: 60      # a 4,000-token reply at about 70 tokens a second takes close to a minute
network_retries: 3
backoff_base_s: 1.0
repair_retries: 2
# Reasoning effort per step, for models that reason before answering. Hidden reasoning tokens
# count as output tokens, so a step that only classifies should not spend many.
# Allowed: "" (provider default), minimal, low, medium, high. Sent to OpenRouter and OpenAI;
# Anthropic models do not reason unless asked, so nothing is sent. Set to "" for an OpenAI
# model that rejects the setting.
reasoning_effort:
  planner: low
# Save every request sent to the model, with its reply, next to the session trace
# (var/traces/<date>/prompts/<session>.jsonl). These files hold the same company data as the
# traces, stay on this machine and are never committed. Set to false to turn this off.
save_prompts: true
